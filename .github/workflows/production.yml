name: Vercel Production Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy-production:
    # Vercel Git already deploys production on push to master.
    # `vercel deploy --prebuilt` from this workflow 404s `/` when
    # cleanUrls is enabled: Git served the Foresty SPA, then this
    # job aliased foresty.dev to NOT_FOUND. Keep production on Git.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
